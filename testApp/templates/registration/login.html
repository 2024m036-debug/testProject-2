<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - 爆速メール生成</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .login-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }
        .login-card h2 {
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 2rem;
            text-align: center;
        }
        /* Djangoフォーム(form.as_p)内のinputタグを美しくする */
        .login-card p {
            margin-bottom: 1.2rem;
        }
        .login-card p label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 0.4rem;
        }
        .login-card p input {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.6rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-card p input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn-login {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 0.6rem;
            padding: 0.8rem;
            width: 100%;
            font-weight: 700;
            margin-top: 1rem;
            transition: transform 0.1s;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            color: white;
        }
        .footer-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #6b7280;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>ログイン</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-login">ログイン</button>
    </form>

    <div class="footer-text">
        ※ユーザー登録がまだの場合は<br>管理者に連絡してください。
    </div>
</div>

</body>
</html>
